<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Analysis: Gemini CLI vs Codex</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css');

        :root {
            --action-blue: #0066cc;
            --ink: #1d1d1f;
            --canvas: #ffffff;
            --parchment: #f5f5f7;
            --tile-dark: #1d1d1f;
            --text-on-dark: #ffffff;
            --spacing-section: 80px;
            --apple-tight: -0.045em;
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Paperlogy', sans-serif; 
        }

        #root { 
            width: 1920px; height: 1080px; background-color: var(--canvas); 
            position: relative; overflow: hidden; flex-shrink: 0;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
            transform-origin: center;
        }

        .clip { 
            position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: var(--spacing-section); box-sizing: border-box; text-align: center; 
            opacity: 0; visibility: hidden; transition: opacity 0.6s ease;
            background: radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
        }
        .clip.active { opacity: 1 !important; visibility: visible !important; }

        h1 { font-size: 100px; font-weight: 800; margin: 0; line-height: 1.1; letter-spacing: var(--apple-tight); color: var(--ink); }
        h2 { font-size: 70px; font-weight: 800; margin-bottom: 40px; line-height: 1.2; letter-spacing: var(--apple-tight); }
        
        .hero-text { font-size: 32px; max-width: 1200px; margin-top: 40px; line-height: 1.6; color: #424245; }
        .dark h1, .dark h2, .dark .hero-text { color: var(--text-on-dark); }

        /* --- STRICT Components --- */
        .kpi-container { display: flex; gap: 40px; margin-top: 40px; justify-content: center; width: 100%; }
        .kpi-block { background: var(--parchment); padding: 50px; border-radius: 30px; min-width: 400px; border: 1px solid #e3e3e7; }
        .dark .kpi-block { background: #272729; border-color: #333; }
        .kpi-value { font-size: 100px; font-weight: 800; color: var(--action-blue); letter-spacing: -0.05em; }
        .kpi-label { font-size: 24px; font-weight: 500; color: var(--ink); margin-top: 20px; line-height: 1.4; }
        .dark .kpi-label { color: #fff; }

        .apple-table { width: 1500px; border-collapse: collapse; margin-top: 40px; font-size: 24px; background: white; border-radius: 20px; overflow: hidden; }
        .apple-table th { background: var(--parchment); padding: 25px; font-weight: 800; text-align: center; border-bottom: 2px solid #e3e3e7; }
        .apple-table td { padding: 25px; border-bottom: 1px solid #f5f5f7; text-align: center; color: var(--ink); line-height: 1.4; }
        .dark .apple-table { background: #1d1d1f; color: white; border: 1px solid #333; }
        .dark .apple-table th { background: #272729; border-bottom-color: #333; }

        .flow-container { display: flex; align-items: center; gap: 20px; margin-top: 50px; width: 1600px; justify-content: space-between; }
        .flow-step { background: var(--action-blue); color: white; padding: 40px 30px; border-radius: 25px; font-size: 26px; font-weight: 700; flex: 1; min-height: 120px; display: flex; align-items: center; justify-content: center; }
        .flow-arrow { font-size: 40px; color: var(--action-blue); font-weight: 900; }

        .comparison-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; width: 1600px; margin-top: 40px; }
        .comp-box { padding: 50px; border-radius: 40px; text-align: left; }
        .comp-box.light { background: var(--parchment); border: 1px solid #e3e3e7; }
        .comp-box.dark { background: var(--tile-dark); color: white; border: 1px solid #333; }
        .comp-box h3 { font-size: 36px; margin-bottom: 25px; color: var(--action-blue); }
        .comp-box p { font-size: 24px; line-height: 1.6; }

        .insight-list { text-align: left; max-width: 1300px; margin-top: 40px; }
        .insight-item { font-size: 26px; color: #424245; margin-bottom: 15px; padding-left: 30px; position: relative; }
        .insight-item::before { content: "•"; position: absolute; left: 0; color: var(--action-blue); font-weight: 800; }
        .dark .insight-item { color: #a1a1a6; }

        /* UI Overlay */
        .ui-overlay { position: fixed; bottom: 40px; right: 40px; display: flex; gap: 15px; z-index: 9999; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 35px; backdrop-filter: blur(10px); }
        .btn-ui { background: var(--action-blue); color: white; border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 18px; font-weight: 700; font-family: 'Paperlogy'; }
        
        .light { background-color: var(--canvas); color: var(--ink); }
        .dark { background-color: var(--tile-dark); color: var(--text-on-dark); }
        .parchment { background-color: var(--parchment); color: var(--ink); }
    </style>
</head>
<body>

    <div id="root"></div>

    <div class="ui-overlay">
        <button class="btn-ui" onclick="prevSlide()">PREV</button>
        <button class="btn-ui" onclick="nextSlide()">NEXT</button>
        <button class="btn-ui" onclick="toggleZoom()">ZOOM</button>
    </div>

    <script>
        // 데이터 임베딩 (정규화된 최신 데이터)
        const slides = [{"id": "slide_1", "type": "hero", "title": "Gemini CLI vs Codex: AI 개발 도구의 패러다임 전환", "content": "단순 코드 완성을 넘어 자율 실행형 에이전트로 진화하는 AI 개발 환경을 분석합니다. 본 슬라이드는 GitHub Copilot(Codex)의 보조적 역할과 Gemini CLI의 에이전틱 자율성을 정밀 비교하여 최적의 도입 전략을 제시합니다.", "theme": "light"}, {"id": "slide_2", "type": "kpi", "title": "핵심 성능 및 생산성 지표 분석", "kpis": [{"value": "1M+", "label": "Gemini CLI 컨텍스트 창 (Tokens)"}, {"value": "40%↑", "label": "에이전틱 워크플로 기반 개발 속도 향상"}, {"value": "$0", "label": "Gemini CLI 개인 개발자 무료 티어"}], "insights": ["Gemini CLI는 100만 토큰 이상의 압도적 컨텍스트로 프로젝트 전체를 한 번에 이해합니다.", "기존 Codex 기반 완성 도구 대비 다단계 작업 자율 실행을 통해 생산성이 비약적으로 상승합니다."], "theme": "dark"}, {"id": "slide_3", "type": "table", "title": "기술 아키텍처 및 철학 정밀 비교", "headers": ["분석 항목", "Gemini CLI (Agentic)", "GitHub Copilot (Assistant)"], "rows": [["핵심 철학", "Plan-Act-Validate 자율 루프", "실시간 코드 완성 및 명령 제안"], ["컨텍스트 범위", "전체 코드베이스 (1M+ Tokens)", "현재 파일 및 관련 스니펫 (200k)"], ["실행 능력", "쉘 명령, 테스트 실행, 파일 수정", "코드 생성 및 채팅 기반 제안"], ["통합 환경", "CLI / 터미널 중심", "IDE (VS Code) / GitHub Native"]], "theme": "light"}, {"id": "slide_4", "type": "comparison", "title": "패러다임의 변화: 보조자 vs 실행자", "comparisons": [{"label": "Legacy: Codex Assistant", "text": "개발자가 코드를 작성할 때 다음 줄을 제안하거나 함수 단위의 완성을 돕습니다. 제어권은 100% 개발자에게 있으며, 수동적인 피드백 루프를 가집니다."}, {"label": "Innovation: Gemini Agent", "text": "목표(Goal)를 주면 스스로 계획을 세우고, 파일을 검색하며, 코드를 수정하고, 테스트를 돌려 검증까지 마칩니다. 능동적인 문제 해결 에이전트 역할을 수행합니다."}], "theme": "dark"}, {"id": "slide_5", "type": "flow", "title": "Gemini CLI의 에이전틱 워크플로 (ReAct Loop)", "steps": ["Task 입력 및 계획 수립 (Planning)", "코드베이스 검색 및 분석 (Research)", "코드 수정 및 쉘 명령 실행 (Execution)", "테스트 및 린트 검증 (Validation)"], "theme": "parchment"}, {"id": "slide_6", "type": "table", "title": "사용자 시나리오별 최적 도구 매트릭스", "headers": ["시나리오", "추천 도구", "핵심 이유"], "rows": [["대규모 리팩토링", "Gemini CLI", "전체 프로젝트 컨텍스트 이해 및 일괄 수정 능력"], ["신규 기능 타이핑", "Copilot", "IDE 내 실시간 인라인 자동 완성 속도 우위"], ["복잡한 버그 디버깅", "Gemini CLI", "로그 분석 및 테스트 실행을 통한 자율 검증"], ["GitHub 협업 (PR/Review)", "Copilot", "GitHub Issue 및 PR 시스템과의 완벽한 연동"]], "theme": "light"}, {"id": "slide_7", "type": "kpi", "title": "경제성 및 접근성 평가", "kpis": [{"value": "Free", "label": "Gemini CLI API (개인 사용 시)"}, {"value": "$10~$20", "label": "Copilot 월간 구독료 (Individual)"}, {"value": "Open", "label": "Gemini CLI 오픈소스 라이선스"}], "insights": ["Gemini CLI는 고성능 추론 능력을 갖추면서도 관대한 무료 정책을 통해 도입 장벽을 낮췄습니다.", "Copilot은 기업 환경에서의 보안과 통합 관리 측면에서 유료 가치를 제공합니다."], "theme": "dark"}, {"id": "slide_8", "type": "comparison", "title": "장단점 정밀 대조", "comparisons": [{"label": "Gemini CLI Pros & Cons", "text": "장점: 강력한 자율성, 대용량 컨텍스트, 무료 접근성. 단점: 추론 루프로 인한 초기 응답 지연."}, {"label": "Codex / Copilot Pros & Cons", "text": "장점: 빠른 속도, IDE 밀착 통합, 검증된 사용자 경험. 단점: 제한된 자율성, 유료 구독 필수."}], "theme": "light"}, {"id": "slide_9", "type": "flow", "title": "성공적인 에이전트 도입 로드맵", "steps": ["Gemini CLI 환경 설정 및 API 연결", "GEMINI.md를 통한 팀별 커스텀 스킬 정의", "반복적인 CI/CD 및 테스트 자동화 루프 구축", "인적 검토를 최소화하는 자율 개발 프로세스 안착"], "theme": "parchment"}, {"id": "slide_10", "type": "hero", "title": "결론: 도구가 아닌 파트너를 선택하십시오", "content": "단순한 오타 교정을 넘어 전략적 파트너로서 Gemini CLI를 활용하십시오. 에이전틱 워크플로는 개발자의 시간을 코딩에서 설계로 옮겨줄 것입니다. 지금 바로 /slide 명령으로 당신의 전략을 시각화하십시오.", "theme": "light"}];

        let currentIdx = 0;
        const root = document.getElementById('root');

        function renderSlides() {
            root.innerHTML = slides.map((s, i) => {
                let contentHtml = '';
                if (s.type === 'hero') {
                    contentHtml = `<h1>${s.title.replace(/\n/g, '<br>')}</h1><p class="hero-text">${s.content}</p>`;
                } else if (s.type === 'kpi') {
                    contentHtml = `<h2>${s.title}</h2>
                        <div class="kpi-container">${s.kpis.map(k => `<div class="kpi-block"><div class="kpi-value">${k.value}</div><div class="kpi-label">${k.label}</div></div>`).join('')}</div>
                        ${s.insights ? `<div class="insight-list">${s.insights.map(ins => `<div class="insight-item">${ins}</div>`).join('')}</div>` : ''}`;
                } else if (s.type === 'table') {
                    contentHtml = `<h2>${s.title}</h2><table class="apple-table"><thead><tr>${s.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r => `<tr>${r.map(td => `<td>${td}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
                } else if (s.type === 'comparison') {
                    contentHtml = `<h2>${s.title}</h2><div class="comparison-layout">${s.comparisons.map((c, ci) => `<div class="comp-box ${ci % 2 === 0 ? 'light' : 'dark'}"><h3>${c.label}</h3><p>${c.text.replace(/\n/g, '<br>')}</p></div>`).join('')}</div>`;
                } else if (s.type === 'flow') {
                    contentHtml = `<h2>${s.title}</h2><div class="flow-container">${s.steps.map((step, si) => `<div class="flow-step">${step.replace(/\n/g, '<br>')}</div>${si < s.steps.length - 1 ? '<div class="flow-arrow">→</div>' : ''}`).join('')}</div>`;
                }
                return `<div class="clip ${s.theme || 'light'}" id="slide-${i}">${contentHtml}</div>`;
            }).join('');
        }

        function showSlide(idx) {
            document.querySelectorAll('.clip').forEach((c, i) => { i === idx ? c.classList.add('active') : c.classList.remove('active'); });
            currentIdx = idx;
        }

        window.nextSlide = () => showSlide((currentIdx + 1) % slides.length);
        window.prevSlide = () => showSlide((currentIdx - 1 + slides.length) % slides.length);
        window.toggleZoom = () => { root.style.transform = root.style.transform === 'scale(0.85)' ? fit() : 'scale(0.85)'; };

        function fit() { 
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080) * 0.95;
            root.style.transform = `scale(${scale})`; 
            return root.style.transform;
        }

        window.addEventListener('resize', fit);
        window.addEventListener('keydown', e => { 
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide(); 
            if (e.key === 'ArrowLeft') prevSlide(); 
        });

        renderSlides();
        showSlide(0);
        fit();
    </script>
</body>
</html>
